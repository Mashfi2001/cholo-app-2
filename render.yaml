services:
  - type: web
    name: cholo-app-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: OCR_SPACE_LANGUAGE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FARE_RATE_PER_KM
        sync: false
      - key: FARE_MIN_TRIP_KM
        sync: false
